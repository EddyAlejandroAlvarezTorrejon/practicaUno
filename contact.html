<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Contáctanos</h1>

  </form>
</body>
</html>
